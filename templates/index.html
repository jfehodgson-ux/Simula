<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Pilas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; padding: 20px; gap: 30px; background-color: #121026; color: #d1d0e5;}
        .panel { flex: 1; background: #1f1b3d; padding: 25px; border-radius: 12px; border: 1px solid #3b3570; }
        
        h2 { margin-top: 0; color: #fff; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;}
        .step-circle { background: #6c5ce7; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; }
        
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; color: #a5a1c9;}
        
        input { padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #131127; border: 1px solid #3b3570; color: white; border-radius: 6px; }
        input:focus { outline: none; border-color: #6c5ce7; }
        
        button { cursor: pointer; padding: 12px; margin-top: 15px; width: 100%; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; transition: background 0.2s;}
        .btn-primary { background: #e0e0ff; color: #121026; }
        .btn-primary:hover { background: #ffffff; }
        .btn-secondary { background: transparent; border: 1px dashed #6c5ce7; color: #6c5ce7; margin-top: 5px; width: auto; padding: 8px 15px; font-size: 0.9rem;}
        .btn-secondary:hover { background: rgba(108, 92, 231, 0.1); }
        .btn-push { background: #4a47a3; color: white; }
        
        /* Estilos para los recuadros individuales de definición */
        .def-field-box { display: flex; gap: 10px; align-items: center; background: #2a2550; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #4a47a3;}
        .def-field-box input { margin: 0; border: none; background: #131127; }
        .remove-btn { width: auto; padding: 10px 15px; background: #ff4757; color: white; margin: 0; border-radius: 6px;}
        
        .stack-container { display: flex; flex-direction: column-reverse; align-items: center; border-left: 4px solid #4a47a3; border-right: 4px solid #4a47a3; border-bottom: 4px solid #4a47a3; width: 300px; min-height: 400px; margin: 20px auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 0 0 8px 8px; }
        .stack-item { width: 100%; background: #6c5ce7; color: white; padding: 12px; margin-top: 8px; border-radius: 6px; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.2); }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .action-buttons button { margin-top: 0; }
    </style>
</head>
<body>

    <div class="panel">
        <h2><span class="step-circle">1</span> Estructura de la Pila</h2>
        <p style="color: #a5a1c9; font-size: 0.9rem;">Creá un recuadro por cada dato que quieras guardar.</p>
        
        <div id="defFieldsContainer">
            <!-- Recuadro individual 1 por defecto -->
            <div class="def-field-box">
                <input type="text" class="def-campo" placeholder="Ej: Nombre">
            </div>
        </div>
        
        <button class="btn-secondary" onclick="addDefField()">+ Agregar otro campo</button>

        <label style="margin-top: 25px;">Capacidad máxima de la pila (Límite)</label>
        <input type="number" id="capacidadInput" min="1" max="20" value="8">

        <button class="btn-primary" onclick="setStructure()">Guardar estructura</button>
        <p id="msg1" style="color: #00d2d3; font-weight: bold; font-size: 0.9rem; text-align: center; height: 20px;"></p>
    </div>

    <div class="panel">
        <h2><span class="step-circle">2</span> Apilá un elemento</h2>
        <p style="color: #a5a1c9; font-size: 0.9rem;">Completá los datos y tocá Push para meterlo a la pila.</p>
        
        <div id="dynamicInputs" style="margin-bottom: 15px; background: #2a2550; padding: 15px; border-radius: 8px;">
            <p style="color: #ff7675; font-size: 0.9rem; text-align: center; margin: 0;">Primero guardá la estructura en el paso 1.</p>
        </div>
        <button class="btn-push" onclick="pushItem()" id="btnPush" disabled>Push (Apilar)</button>

        <hr style="border-color: #3b3570; margin: 30px 0;">

        <h2><span class="step-circle">3</span> Controles de Pila</h2>
        <div class="action-buttons">
            <button onclick="popItem()" style="background: #ff4757; color: white;">Pop (Sacar)</button>
            <button onclick="peekItem()" style="background: #00d2d3; color: #121026;">Peek (Ver Cima)</button>
            <button onclick="clearStack()" style="background: #feca57; color: #121026;">Clear (Vaciar)</button>
        </div>
        <p id="msg2" style="color: #ff7675; font-weight: bold; font-size: 0.9rem; text-align: center; height: 20px; margin-top: 15px;"></p>
    </div>

    <div class="panel" style="text-align: center;">
        <h2 style="justify-content: center;">Pila Gráfica</h2>
        <p id="capacidadTexto" style="color: #a5a1c9; font-size: 0.9rem; font-weight: bold;">Capacidad: 0 / 8</p>
        <div class="stack-container" id="stackVisual"></div>
    </div>

    <script>
        let currentFields = [];
        let maxCap = 8;

        async function req(endpoint, method = 'POST', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(endpoint, options);
            return res.json();
        }

        function showMsg(id, txt) {
            document.getElementById(id).innerText = txt;
            setTimeout(() => document.getElementById(id).innerText = '', 3000);
        }

        function renderStack(pila) {
            const container = document.getElementById('stackVisual');
            container.innerHTML = '';
            document.getElementById('capacidadTexto').innerText = `Capacidad: ${pila.length} / ${maxCap}`;
            
            pila.forEach(item => {
                const div = document.createElement('div');
                div.className = 'stack-item';
                div.innerHTML = Object.entries(item).map(([k, v]) => `<b style="color:#d1d0e5">${k}:</b> ${v}`).join('<br>');
                container.appendChild(div);
            });
        }

        // Crea un nuevo recuadro individual para definir un campo
        function addDefField() {
            const container = document.getElementById('defFieldsContainer');
            const row = document.createElement('div');
            row.className = 'def-field-box';
            row.innerHTML = `
                <input type="text" class="def-campo" placeholder="Nuevo campo...">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        async function setStructure() {
            const inputs = document.querySelectorAll('.def-campo');
            // Recorre cada recuadro individual y extrae su valor
            const campos = Array.from(inputs).map(inp => inp.value.trim()).filter(val => val !== '');
            const capacidad = document.getElementById('capacidadInput').value;

            if (campos.length === 0) return showMsg('msg1', "Agrega al menos un recuadro con nombre.");
            
            const data = await req('/set_structure', 'POST', { campos, capacidad });
            currentFields = data.estructura;
            maxCap = data.capacidad;
            
            // Genera los recuadros para rellenar en el Paso 2
            const inputsContainer = document.getElementById('dynamicInputs');
            inputsContainer.innerHTML = currentFields.map(campo => 
                `<div style="margin-bottom: 10px;">
                    <label style="margin-top: 5px;">${campo}</label>
                    <input type="text" id="val_${campo}" placeholder="Escribe el valor para ${campo}">
                </div>`
            ).join('');
            
            document.getElementById('btnPush').disabled = false;
            renderStack([]);
            showMsg('msg1', "Estructura configurada.");
        }

        async function pushItem() {
            if (currentFields.length === 0) return;
            
            let elemento = {};
            for (let campo of currentFields) {
                let val = document.getElementById(`val_${campo}`).value.trim();
                if (!val) return showMsg('msg2', `Completá el campo: ${campo}`);
                elemento[campo] = val;
            }

            const data = await req('/push', 'POST', { elemento });
            if (data.error) return showMsg('msg2', data.error);
            
            renderStack(data.pila);
            currentFields.forEach(campo => document.getElementById(`val_${campo}`).value = '');
        }

        async function popItem() {
            const data = await req('/pop');
            if (data.error) return showMsg('msg2', data.error);
            renderStack(data.pila);
        }

        async function peekItem() {
            const data = await req('/peek', 'GET');
            if (data.error) return showMsg('msg2', data.error);
            alert("En la cima de la pila está:\n" + JSON.stringify(data.cima, null, 2));
        }

        async function clearStack() {
            const data = await req('/clear');
            renderStack(data.pila);
        }
    </script>
</body>
</html>
